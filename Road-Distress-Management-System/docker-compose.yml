services:
  postgres:
    image: postgres:16
    container_name: rdms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: road_distress_db
      POSTGRES_USER: rdms_user
      POSTGRES_PASSWORD: rdms_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdms_user -d road_distress_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: rdms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: rdms_user
      POSTGRES_PASSWORD: rdms_password
      POSTGRES_DB: road_distress_db
      POSTGRES_PORT: "5432"
      BACKEND_CORS_ORIGINS: "*"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/models:/app/backend/models
      # Generated PDF/Excel reports now live under backend/uploads/reports/
      # (see pdf_generator.py/excel_generator.py) -- already covered by the
      # uploads mount above, no separate mount needed.

  nginx:
    image: nginx:alpine
    container_name: rdms-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The Flutter project (mobile/) lives one level up, as a sibling of
      # this Road-Distress-Management-System/ folder, not nested inside it
      # -- build it there first with `flutter build web --release
      # --dart-define=API_BASE_URL=...` (see DEPLOYMENT.md).
      - ../mobile/build/web:/usr/share/nginx/html:ro

volumes:
  postgres_data:

